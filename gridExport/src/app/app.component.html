<ag-grid-angular
  #gridTable
  [rowData]="rowData"
  [pagination]=true
  class="ag-theme-quartz"
  style="width: 100%; height: 500px;"
  [columnDefs]="colDefs"
  (gridReady)="onGridReady($event)"
></ag-grid-angular>
<button (click)="downloadCsv()">Download as csv</button>
<button (click)="downloadPdf()">Download as PDF</button>
